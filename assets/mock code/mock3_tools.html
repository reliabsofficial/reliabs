<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Mock 3 — All Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body {
    width:520px; height:500px;
    background: transparent;
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }

  .scene {
    position:relative;
    width:520px; height:500px;
  }

  .tool-icon {
    position:absolute;
    opacity:0;
    animation: popIn 0.5s ease forwards;
  }

  .icon-box {
    border-radius:22px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.1);
    display:flex; align-items:center; justify-content:center;
  }

  @keyframes popIn {
    0%   { opacity:0; transform:scale(0.6); }
    70%  { opacity:1; transform:scale(1.05); }
    100% { opacity:1; transform:scale(1); }
  }

  /* center connector lines via SVG */
  .connector-svg {
    position:absolute; inset:0; pointer-events:none;
    opacity:0;
    animation: fadeIn 0.4s 1.6s ease forwards;
  }

  @keyframes fadeIn { to { opacity:1; } }

  .conn-line {
    stroke: rgba(59,130,246,0.2);
    stroke-width:1.2;
    stroke-dasharray:5 4;
    fill:none;
  }

  /* center logo node */
  .center-node {
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    z-index:10;
    opacity:0;
    animation: popIn 0.5s 1.4s ease forwards;
  }

  .center-circle {
    width:54px; height:54px; border-radius:50%;
    background: radial-gradient(circle at 40% 35%, #60a5fa, #3b82f6 40%, #1d4ed8 70%, #1e3a8a);
    box-shadow:
      0 0 30px 10px rgba(59,130,246,0.5),
      0 0 60px 20px rgba(59,130,246,0.2);
    display:flex; align-items:center; justify-content:center;
    border:2px solid rgba(255,255,255,0.2);
  }

  .center-label {
    position:absolute;
    bottom:-22px; left:50%; transform:translateX(-50%);
    font-size:10px; font-weight:700; color:rgba(255,255,255,0.5);
    white-space:nowrap; letter-spacing:0.06em; text-transform:uppercase;
  }

  /* "more coming soon" pill */
   .more-pill {
    position:absolute;
    bottom:18px; left:50%; transform:translateX(-50%);
    font-size:11px; font-weight:500;
    color:rgba(255,255,255,0.35);
    background:transparent;
    border:1px solid rgba(255,255,255,0.1);
    border-radius:99px;
    padding:5px 14px;
    white-space:nowrap;
    opacity:0;
    animation:fadeIn 0.5s 2.2s ease forwards;
  }
</style>
</head>
