<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mock 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: transparent;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', sans-serif;
  }

  :root {
    --blue: #4F8EF7;
    --blue-soft: #6BA3FA;
    --blue-dim: rgba(79,142,247,0.15);
    --white: #FFFFFF;
    --white-70: rgba(255,255,255,0.7);
    --white-40: rgba(255,255,255,0.4);
  }

  .mock {
    width: 300px;
    height: 430px;
    border-radius: 32px;
    background: rgba(20, 22, 28, 0.42);
    backdrop-filter: blur(28px) saturate(1.6);
    -webkit-backdrop-filter: blur(28px) saturate(1.6);
    border: 1px solid rgba(255,255,255,0.11);
    box-shadow:
      0 2px 0 rgba(255,255,255,0.07) inset,
      0 40px 100px rgba(0,0,0,0.35),
      0 0 0 0.5px rgba(0,0,0,0.35);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* shimmer */
  .mock::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 55%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.025), transparent);
    animation: shimmer 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shimmer {
    0% { left: -100%; }
    45%, 100% { left: 140%; }
  }

  .notch {
    width: 72px; height: 6px;
    background: rgba(255,255,255,0.12);
    border-radius: 999px;
    margin: 14px auto 0;
    flex-shrink: 0;
  }

  .chips {
    display: flex;
    gap: 6px;
    padding: 12px 16px 6px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .chip {
    font-size: 10.5px;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.09);
    color: rgba(255,255,255,0.4);
  }
  .chip.on {
    background: rgba(79,142,247,0.15);
    border-color: rgba(79,142,247,0.25);
    color: var(--blue-soft);
  }

  .chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 10px;
    padding: 10px 16px 10px;
    overflow: hidden;
  }

  .bubble-row {
    display: flex;
    align-items: flex-end;
    gap: 7px;
  }
  .bubble-row.user { flex-direction: row-reverse; }

  .av {
    width: 26px; height: 26px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .av.ai {
    background: conic-gradient(from 200deg, #4F8EF7 0%, #F97316 50%, #4F8EF7 100%);
  }
  .av.me {
    background: linear-gradient(135deg, #555, #333);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: rgba(255,255,255,0.6); font-weight: 500;
  }

  .bub {
    max-width: 195px;
    padding: 9px 12px;
    border-radius: 16px;
    font-size: 12px;
    line-height: 1.5;
    font-weight: 300;
  }
  .bub.ai-bub {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.09);
    color: var(--white-70);
    border-bottom-left-radius: 4px;
  }
  .bub.user-bub {
    background: rgba(79,142,247,0.22);
    border: 1px solid rgba(79,142,247,0.25);
    color: var(--white);
    border-bottom-right-radius: 4px;
    text-align: right;
  }

  /* typing indicator */
  .typing-row {
    display: flex;
    align-items: flex-end;
    gap: 7px;
  }
  .typing-bub {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 9px 13px;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.09);
  }
  .tdot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--blue-soft);
    opacity: 0.5;
    animation: bounce 1.4s ease-in-out infinite;
  }
  .tdot:nth-child(2) { animation-delay: 0.2s; }
  .tdot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
  .typing-label {
    font-size: 10.5px;
    color: rgba(255,255,255,0.35);
    margin-left: 4px;
  }

  .input-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 12px 14px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 999px;
    padding: 10px 12px;
    flex-shrink: 0;
  }
  .input-label {
    flex: 1;
    font-size: 12px;
    color: rgba(255,255,255,0.35);
  }
  .icon-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .icon-btn.mic { background: rgba(255,255,255,0.10); }
  .icon-btn.send { background: var(--blue); }
</style>
</head>
<body>
<div class="mock">
  <div class="notch"></div>

  <div class="chips">
    <span class="chip on">Weekly briefing</span>
    <span class="chip">Top bets</span>
    <span class="chip">Churn signals</span>
  </div>

  <div class="chat">
    <!-- faded old bubble -->
    <div class="bubble-row" style="opacity:0.3;filter:blur(1.5px);">
      <div class="av ai"></div>
      <div class="bub ai-bub">Here's what I found from last week's signals…</div>
    </div>

    <!-- user -->
    <div class="bubble-row user">
      <div class="av me">M</div>
      <div class="bub user-bub">"Who are our highest-churn accounts this quarter?"</div>
    </div>

    <!-- typing -->
    <div class="typing-row">
      <div class="av ai"></div>
      <div class="typing-bub">
        <div class="tdot"></div>
        <div class="tdot"></div>
        <div class="tdot"></div>
        <span class="typing-label">Reliabs is thinking…</span>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <span class="input-label">Ask Reliabs</span>
    <!-- mic -->
    <div class="icon-btn mic">
      <svg width="13" height="15" viewBox="0 0 13 15" fill="none">
        <rect x="4" y="0" width="5" height="9" rx="2.5" fill="rgba(255,255,255,0.55)"/>
        <path d="M1 7.5C1 10.537 3.463 13 6.5 13C9.537 13 12 10.537 12 7.5"
          stroke="rgba(255,255,255,0.45)" stroke-width="1.3" stroke-linecap="round"/>
        <line x1="6.5" y1="13" x2="6.5" y2="15"
          stroke="rgba(255,255,255,0.45)" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </div>
    <!-- send -->
    <div class="icon-btn send">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
        <path d="M6.5 11V2M6.5 2L2 6.5M6.5 2L11 6.5"
          stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
