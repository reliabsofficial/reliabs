<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Notification Mockups</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
    }

    /* ── NOTIFICATION BASE ── */
    .notif {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 16px;
      display: flex;
      align-items: flex-start;
      padding: 12px 14px;
      gap: 10px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.45),
        0 2px 8px rgba(0, 0, 0, 0.25),
        0 0 0 0.5px rgba(255, 255, 255, 0.12);
      position: relative;
    }

    /* ── FIRST: 270×75 ── */
    .n1 {
      width: 300px;
      min-height: 75px;
    }

    /* ── SECOND & THIRD: 280×55 ── */
    .n2,
    .n3 {
      width: 300px;
      height: 55px;
      align-items: center;
      padding: 0 14px;
    }

    /* ── LOGO SLOT ── */
    .logo-slot {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
    }

    .logo-slot img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      display: block;
    }

    /* ── TEXT CONTENT ── */
    .notif-body {
      flex: 1;
      min-width: 0;
    }

    .notif-name {
      font-size: 12.5px;
      font-weight: 700;
      color: #111;
      line-height: 1.2;
      margin-bottom: 3px;
      letter-spacing: -0.01em;
    }

    .notif-text {
      font-size: 11.5px;
      font-weight: 400;
      color: #444;
      line-height: 1.4;
      letter-spacing: -0.005em;
    }

    /* single line for n2/n3 */
    .n2 .notif-text,
    .n3 .notif-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── TIME / CIRCLE INDICATOR ── */
    .time {
      font-size: 10px;
      color: #aaa;
      flex-shrink: 0;
      align-self: flex-end;
      padding-bottom: 1px;
    }

    .circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid #ddd;
      flex-shrink: 0;
      align-self: center;
    }
  </style>
</head>

<body>

  <!-- NOTIFICATION 1 — 270×75 with time -->
  <div class="notif n1">
    <div class="logo-slot"><img src="../../reliabslogo/reliabs-logo-64px.png" alt="Reliabs"></div>
    <div class="notif-body">
      <div class="notif-name">Reliabs</div>
      <div class="notif-text">Top signup flow is bleeding users.I grouped sessions, tickets, quotes and drafted a fix
        you can turn into a shippable opportunity</div>
    </div>
    <div class="time">2m</div>
  </div>

  <!-- NOTIFICATION 2 — 280×55 with circle -->
  <div class="notif n2">
    <div class="logo-slot"><img src="../../reliabslogo/reliabs-logo-64px.png" alt="Reliabs"></div>
    <div class="notif-body">
      <div class="notif-name">Reliabs</div>
      <div class="notif-text">Your onboarding just lifted activation</div>
    </div>
    <div class="circle"></div>
  </div>

  <!-- NOTIFICATION 3 — 280×55 with circle -->
  <div class="notif n3">
    <div class="logo-slot"><img src="../../reliabslogo/reliabs-logo-64px.png" alt="Reliabs"></div>
    <div class="notif-body">
      <div class="notif-name">Reliabs</div>
      <div class="notif-text">Today’s release unlocked new revenue</div>
    </div>
    <div class="circle"></div>
  </div>

</body>

</html>
